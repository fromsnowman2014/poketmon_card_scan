# CI for pull requests; CI + GitHub Pages deploy for pushes to main; once a day, fresh prices for Japanese cards.
# One-time setup (see README "처음 배포하기 / First deploy"): the repo must be public (or on GitHub Pro), and
# Settings → Pages → Source: "GitHub Actions". The base path comes from the Pages settings, so a renamed repo or a
# custom domain needs no change here.
name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_products:
        description: "Japanese card prices: read every TCGplayer product list again (card numbers), not only new ones"
        type: boolean
        default: false
  schedule:
    # Japanese card prices once a day. tcgcsv.com refreshes around 20:00 UTC: 21:17 picks that up, 03:17 is a second
    # try that changes nothing when the first one worked. Off the hour, because GitHub starts schedules late at busy
    # times. GitHub switches schedules off after 60 days without a commit (README "가격은 어디서 오나요?").
    - cron: "17 21 * * *"
    - cron: "17 3 * * *"

# As in GitHub's Pages starter workflows: configure-pages reads the Pages site (needs Pages permission) and
# deploy-pages publishes with an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; a running deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # 'success' = publish this build. A scheduled run without new prices has nothing to publish.
      pages: ${{ steps.publish.outputs.publish == 'true' && 'success' || 'skipped' }}
    env:
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Test eBay worker
        run: node worker/test.mjs

      # Before the build: its base_path ("/poketmon_card_scan", or "" for a custom domain) becomes Vite's base.
      # It fails while GitHub Pages is off; the next step tells that case apart from real errors.
      - name: Configure GitHub Pages
        if: env.DEPLOY == 'true'
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      # Pages not enabled (API 404): expected before the one-time setup, or when the app is hosted on Cloudflare
      # Pages. The run stays green, still builds, skips the deploy and says why. Anything else fails the run.
      - name: Check GitHub Pages
        if: env.DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED: ${{ steps.pages.outcome }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          err="$RUNNER_TEMP/pages-error.txt"
          if source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>"$err"); then
            if [ "$source" = "legacy" ]; then
              echo "::error title=GitHub Pages source is not GitHub Actions::Settings → Pages → Build and deployment → Source: choose \"GitHub Actions\" (it is \"Deploy from a branch\"), then Actions → Build & Deploy → Run workflow."
              exit 1
            fi
            if [ "$CONFIGURED" != "success" ]; then
              echo "::error title=GitHub Pages setup failed::GitHub Pages is enabled, but actions/configure-pages failed (see the \"Configure GitHub Pages\" step). Nothing was deployed."
              exit 1
            fi
            echo "GitHub Pages is enabled (source: $source). Deploying to $PAGES_URL"
          elif grep -q "HTTP 404" "$err"; then
            echo "::warning title=Not deployed to GitHub Pages::GitHub Pages is not enabled for this repository, so this run only tests and builds. To publish: Settings → Pages → Source: GitHub Actions (a private repo needs GitHub Pro, or make it public), then Actions → Build & Deploy → Run workflow. Hosting on Cloudflare Pages instead? Then this warning is expected. See README."
          else
            echo "::error title=Could not check GitHub Pages::$(tr '\n' ' ' < "$err" | head -c 500)"
            exit 1
          fi

      # No internet: a small copy of tcgcsv's files and a stand-in server on this machine.
      - name: Test price build script
        run: node scripts/build-ja-prices.test.mjs

      # Deploys only (pull requests never touch the network for this). TCGplayer prices for Japanese cards from
      # tcgcsv.com, a free daily mirror: one small request tells whether it has anything newer than the files already
      # on the site; then ~460 requests, one at a time, 150 ms apart (2-3 minutes; the very first run also reads every
      # product list, about twice that). It never fails the run: when tcgcsv is down or its data looks broken, the
      # files already on the site are published again, and with none Japanese cards show Cardmarket prices as
      # before. The files land in public/data/tcgplayer-ja (git-ignored), which the build copies into dist.
      - name: Japanese card prices (TCGplayer, via tcgcsv.com)
        id: prices
        if: steps.pages.outcome == 'success'
        timeout-minutes: 15
        continue-on-error: true
        env:
          JA_PRICES_PREV: ${{ steps.pages.outputs.base_url }}/data/tcgplayer-ja/all.json
        run: node scripts/build-ja-prices.mjs ${{ inputs.all_products && '--all-products --force' || '' }}

      - name: Type-check and build
        run: npm run build
        env:
          # Deploys: the Pages path plus a trailing slash ("/" for a custom domain). PRs and runs without Pages:
          # /<repo name>/. vite.config.ts normalises the slashes.
          BASE_PATH: ${{ steps.pages.outcome == 'success' && format('{0}/', steps.pages.outputs.base_path) || format('/{0}/', github.event.repository.name) }}

      # Pushes and manual runs always publish. A scheduled run publishes only new prices (status "new"); "same"
      # (nothing newer yet), "kept" (download failed, the site already has these files) and "none" change nothing.
      - name: Publish this build?
        id: publish
        if: steps.pages.outcome == 'success'
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          PRICES: ${{ steps.prices.outputs.status || 'failed' }}
          PRICES_DATE: ${{ steps.prices.outputs.date }}
        run: |
          echo "Japanese card prices: $PRICES ${PRICES_DATE:+($PRICES_DATE)}"
          if [ "$SCHEDULED" = "true" ] && [ "$PRICES" != "new" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled run without new prices: nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          # The daily run turns red, so GitHub emails the repo owner, when the newest prices are three days old (the
          # download keeps failing, or tcgcsv.com has stopped updating) or the price step has no files to show at
          # all ("none": nothing on the site either; "failed": it crashed or ran out of time).
          if [ "$SCHEDULED" = "true" ] && [ "$PRICES" != "new" ]; then
            if [ -z "$PRICES_DATE" ]; then
              echo "::error title=Japanese card prices could not be built::Status \"$PRICES\" (see the price step above). Price files already on the site stay as they are; the app shows Cardmarket prices for Japanese cards when there are none or they are 7 days old."
              exit 1
            fi
            age_days=$(( ( $(date +%s) - $(date -d "$PRICES_DATE" +%s) ) / 86400 ))
            if [ "$age_days" -ge 3 ]; then
              echo "::error title=Japanese card prices are $age_days days old::No newer prices from tcgcsv.com since $PRICES_DATE ($PRICES; see the price step above). The app shows Cardmarket prices for Japanese cards once the files are 7 days old."
              exit 1
            fi
          fi

      - if: steps.publish.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'success'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
